[project]
name = "better-bus-baseline"
version = "0.0.0"
description = "Public-data prototype of a bus performance monitoring plan for CATS, scored against MTC-06."
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["collector"]

[dependency-groups]
dev = [
    "gtfs-kit>=13.0.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "tzdata>=2026.5",
]
