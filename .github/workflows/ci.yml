name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for gitleaks

      - name: Install uv
        run: pipx install uv==0.11.30

      - name: uv sync
        run: uv sync --locked

      - name: ruff
        run: uv run ruff check .

      - name: pytest
        # ponytail: exit 5 = no tests collected; drop the allowance once the first tests land.
        run: uv run pytest || [ $? -eq 5 ]

      - name: gitleaks
        env:
          V: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          base=https://github.com/gitleaks/gitleaks/releases/download/v$V
          curl -sSfLO "$base/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz\$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --no-banner
